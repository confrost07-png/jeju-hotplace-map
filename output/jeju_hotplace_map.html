        <style>
        @keyframes goldenSpin {
            from { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.18); }
            to { transform: rotate(360deg) scale(1); }
        }
        .golden-star {
            width: 34px;
            height: 34px;
            line-height: 34px;
            text-align: center;
            font-size: 30px;
            color: #FFD700;
            text-shadow: 0 0 4px #8B6508, 0 0 10px #FFB300;
            animation: goldenSpin 2.1s linear infinite;
            transform-origin: center;
            pointer-events: none;
        }
        @keyframes firePulse {
            0% { transform: translateY(0) scale(0.92); filter: brightness(1); }
            50% { transform: translateY(-7px) scale(1.22); filter: brightness(1.35); }
            100% { transform: translateY(0) scale(0.92); filter: brightness(1); }
        }
        .hot-fire {
            width: 36px;
            height: 42px;
            line-height: 42px;
            text-align: center;
            font-size: 34px;
            animation: firePulse 0.8s ease-in-out infinite;
            transform-origin: center bottom;
            filter: drop-shadow(0 0 8px #ff5722);
            pointer-events: none;
        }
        </style>
